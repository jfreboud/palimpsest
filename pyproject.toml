[project]
name = "palimpsest"
dynamic = ["version"]
description = "Local MCP server for Claude's persistent memory."
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Jean-François Reboud", email = "jeanfrancois.reboud.gre@gmail.com" },
]

dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "ruff>=0.8.3,<1.0.0",
    "pytest>=8.3.5,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["palimpsest*", "scripts*"]

[tool.ruff]
preview = true
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["I"]
extend-select = ["D", "E", "W", "F", "N", "UP", "B", "FURB", "RET"]
ignore = [
    "E501",
    "PERF203",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D205", "D401", "D404", "D400",
    "RET504",
    "N812", "N806",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D", "F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
